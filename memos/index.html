<script>
    // 自动为所有 target="_blank" 的链接添加 rel="noopener noreferrer"
    document.addEventListener('DOMContentLoaded', function () {
        var links = document.querySelectorAll('a[target="_blank"]');
        links.forEach(function (link) {
            var rel = link.getAttribute('rel') || '';
            if (rel.indexOf('noopener') === -1) {
                rel += ' noopener';
            }
            if (rel.indexOf('noreferrer') === -1) {
                rel += ' noreferrer';
            }
            link.setAttribute('rel', rel.trim());
        });
    });
</script>

<script>
    // declaraction of document.ready() function.
    (function () {
        var ie = !!(window.attachEvent && !window.opera);
        var wk = /webkit\/(\d+)/i.test(navigator.userAgent) && (RegExp.$1 < 525);
        var fn = [];
        var run = function () {
            for (var i = 0; i < fn.length; i++) fn[i]();
        };
        var d = document;
        d.ready = function (f) {
            if (!ie && !wk && d.addEventListener)
                return d.addEventListener('DOMContentLoaded', f, false);
            if (fn.push(f) > 1) return;
            if (ie)
                (function () {
                    try {
                        d.documentElement.doScroll('left');
                        run();
                    } catch (err) {
                        setTimeout(arguments.callee, 0);
                    }
                })();
            else if (wk)
                var t = setInterval(function () {
                    if (/^(loaded|complete)$/.test(d.readyState))
                        clearInterval(t), run();
                }, 0);
        };
    })();


    document.ready(
        function () {
            var _Blog = window._Blog || {};

            const getSystemTheme = () => {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    return 'dark';
                }
                return 'light';
            };

            const configDefault = 'dark';
            const currentTheme = window.localStorage && window.localStorage.getItem('theme');
            const initialTheme = currentTheme || configDefault || getSystemTheme();
            const isDark = initialTheme === 'dark';

            const updateButtons = (dark) => {
                const sunBtn = document.getElementById("theme-toggle-sun");
                const moonBtn = document.getElementById("theme-toggle-moon");
                const mobileSunBtn = document.getElementById("mobile-theme-toggle-sun");
                const mobileMoonBtn = document.getElementById("mobile-theme-toggle-moon");

                if (dark) {
                    if (sunBtn) sunBtn.style.display = 'none';
                    if (moonBtn) moonBtn.style.display = 'inline-block';
                    if (mobileSunBtn) mobileSunBtn.style.display = 'none';
                    if (mobileMoonBtn) mobileMoonBtn.style.display = 'inline-block';
                } else {
                    if (sunBtn) sunBtn.style.display = 'inline-block';
                    if (moonBtn) moonBtn.style.display = 'none';
                    if (mobileSunBtn) mobileSunBtn.style.display = 'inline-block';
                    if (mobileMoonBtn) mobileMoonBtn.style.display = 'none';
                }
            };

            const updateThemeColor = (dark) => {
                const themeColor = dark ? '#292a2d' : '#ffffff';
                const metaTags = document.querySelectorAll('meta[name="theme-color"]');
                if (metaTags.length > 0) {
                    // 保留第一个，移除其他的，避免重复
                    for (let i = 1; i < metaTags.length; i++) {
                        metaTags[i].remove();
                    }
                    metaTags[0].setAttribute('content', themeColor);
                    metaTags[0].removeAttribute('media');
                } else {
                    const meta = document.createElement('meta');
                    meta.name = 'theme-color';
                    meta.content = themeColor;
                    document.head.appendChild(meta);
                }
            };

            const applyTheme = (dark) => {
                const body = document.getElementsByTagName('body')[0];
                if (dark) {
                    body.classList.add('dark-theme');
                } else {
                    body.classList.remove('dark-theme');
                }
                updateButtons(dark);
                updateThemeColor(dark);
            };

            // Initial application
            applyTheme(isDark);
            if (!currentTheme) {
                window.localStorage && window.localStorage.setItem('theme', initialTheme);
            }

            _Blog.toggleTheme = function () {
                const toggleFunc = (e) => {
                    // Prevent bubbling if needed, though buttons are distinct now
                    if (e) e.stopPropagation();

                    const body = document.getElementsByTagName('body')[0];
                    const isCurrentlyDark = body.classList.contains('dark-theme');

                    if (isCurrentlyDark) {
                        body.classList.remove('dark-theme');
                        updateButtons(false);
                        window.localStorage && window.localStorage.setItem('theme', 'light');
                    } else {
                        body.classList.add('dark-theme');
                        updateButtons(true);
                        window.localStorage && window.localStorage.setItem('theme', 'dark');
                    }
                };

                const sunBtn = document.getElementById("theme-toggle-sun");
                const moonBtn = document.getElementById("theme-toggle-moon");
                const mobileSunBtn = document.getElementById("mobile-theme-toggle-sun");
                const mobileMoonBtn = document.getElementById("mobile-theme-toggle-moon");

                if (sunBtn) sunBtn.addEventListener('click', toggleFunc);
                if (moonBtn) moonBtn.addEventListener('click', toggleFunc);
                if (mobileSunBtn) mobileSunBtn.addEventListener('click', toggleFunc);
                if (mobileMoonBtn) mobileMoonBtn.addEventListener('click', toggleFunc);
            };
            _Blog.toggleTheme();

            if (window.matchMedia && !configDefault) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                    const newTheme = e.matches ? 'dark' : 'light';
                    applyTheme(e.matches);
                    window.localStorage && window.localStorage.setItem('theme', newTheme);
                });
            }
        }
    );
</script>

<script>
    // Reading Progress Component
    document.addEventListener('DOMContentLoaded', () => {
        const progressValue = document.querySelector('.reading-value');
        const progressCircle = document.querySelector('.progress-ring__circle');
        const container = document.querySelector('.reading-progress-container');

        // Exit if elements don't exist (e.g., not on a post page)
        if (!progressValue || !progressCircle || !container) {
            return;
        }

        // SVG Circle setup
        const radius = progressCircle.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;

        progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
        progressCircle.style.strokeDashoffset = circumference;

        function setProgress(percent) {
            const safePercent = Math.min(100, Math.max(0, percent));
            progressValue.textContent = `${Math.round(safePercent)}%`;
            const offset = circumference - (safePercent / 100) * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }

        function onScroll() {
            const scrollTop = window.scrollY || document.documentElement.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;

            if (scrollHeight <= 0) {
                setProgress(0);
                return;
            }

            const scrollPercent = (scrollTop / scrollHeight) * 100;
            setProgress(scrollPercent);

            // Show/Hide logic: Show if scrolled more than 100px
            if (scrollTop > 100) {
                container.classList.add('show');
            } else {
                container.classList.remove('show');
            }
        }

        // Initialize
        onScroll();

        // Listen for scroll events
        window.addEventListener('scroll', onScroll, { passive: true });

        // Recalculate on resize
        window.addEventListener('resize', onScroll);
    });
</script>

<script>
    (function () {
        var BLOB_URL = '/images/diary.json';
        // 缓存的是派生出来的密钥（base64 只有 44 字符），不是明文。
        // 这样重新加密过之后旧密钥会解密失败，能明确提示，而不是默默显示旧内容。
        var SESSION_KEY = 'diary.key.v1';
        var MEMO_PER_PAGE = 20;
        var COLLAPSE_HEIGHT = 160;

        var lockPanel = document.getElementById('diary-lock');
        var contentPanel = document.getElementById('diary-content');
        var input = document.getElementById('diary-password');
        var unlockBtn = document.getElementById('diary-unlock');
        var msg = document.getElementById('diary-msg');
        if (!lockPanel || !contentPanel) return;

        var COLORS = ['#ebedf0', '#9be9a8', '#40c463', '#28df99', '#1a9f6b'];
        var MONTHS = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
        var DAYS = ['日', '一', '二', '三', '四', '五', '六'];

        // ---------- 小工具 ----------
        function b64ToBytes(s) {
            var norm = String(s).replace(/-/g, '+').replace(/_/g, '/').replace(/\s+/g, '');
            while (norm.length % 4) norm += '=';
            var bin = atob(norm);
            var out = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
            return out;
        }

        function bytesToB64(bytes) {
            var bin = '';
            for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin);
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        // 正文是 Markdown，用本地 /lib/marked.min.js 渲染
        function renderMarkdown(md) {
            if (window.marked && typeof window.marked.parse === 'function') {
                return window.marked.parse(md);
            }
            return '<p>' + esc(md).replace(/\n/g, '<br>') + '</p>';
        }

        function say(text) {
            if (msg) msg.textContent = text || '';
        }

        function setBusy(busy) {
            if (unlockBtn) {
                unlockBtn.disabled = busy;
                unlockBtn.textContent = busy ? '解密中…' : '解锁';
            }
            if (input) input.disabled = busy;
        }

        // ---------- 取密文 / 派生密钥 / 解密 ----------
        function fetchEnvelope() {
            return fetch(BLOB_URL + '?t=' + Date.now(), { cache: 'no-store' })
                .then(function (res) {
                    if (!res.ok) throw new Error('blob-missing');
                    var ctype = res.headers.get('content-type') || '';
                    if (/text\/html/i.test(ctype)) throw new Error('blob-not-json');
                    return res.json().catch(function () { throw new Error('blob-not-json'); });
                })
                .then(function (env) {
                    if (!env || env.v !== 1) throw new Error('blob-version');
                    if (typeof env.salt !== 'string' || typeof env.iv !== 'string' || typeof env.ct !== 'string') {
                        throw new Error('blob-version');
                    }
                    // 头部没有认证，被改大的 iter 会把标签页卡死，这里设个上限
                    if (!Number.isSafeInteger(env.iter) || env.iter < 10000 || env.iter > 4000000) {
                        throw new Error('blob-version');
                    }
                    return env;
                });
        }

        function deriveKey(passphrase, env) {
            return crypto.subtle
                .importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey'])
                .then(function (km) {
                    return crypto.subtle.deriveKey({
                        name: 'PBKDF2',
                        salt: b64ToBytes(env.salt),
                        iterations: env.iter,
                        hash: 'SHA-256'
                    }, km, { name: 'AES-GCM', length: 256 },
                        true,        // extractable：仅用于把密钥本身缓存进 sessionStorage
                        ['decrypt']);
                });
        }

        function decryptWithKey(key, env) {
            return crypto.subtle
                .decrypt({ name: 'AES-GCM', iv: b64ToBytes(env.iv) }, key, b64ToBytes(env.ct))
                .then(function (buf) {
                    return new TextDecoder().decode(buf).replace(/^﻿/, '');
                });
        }

        function parsePayload(text) {
            try {
                return JSON.parse(text);
            } catch (e) {
                throw new Error('bad-payload');
            }
        }

        function rememberKey(key) {
            return crypto.subtle.exportKey('raw', key).then(function (raw) {
                try {
                    sessionStorage.setItem(SESSION_KEY, bytesToB64(new Uint8Array(raw)));
                } catch (e) { /* 无痕模式等，忽略 */ }
            }).catch(function () { /* 缓存失败不影响使用 */ });
        }

        function describeFailure(err) {
            var m = err && err.message;
            if (m === 'blob-missing') {
                return '找不到 /images/diary.json。先在本地双击「加密日记.cmd」，再回 Gridea 同步一次。';
            }
            if (m === 'blob-not-json') {
                return '拿到的不是 JSON（可能被 404 页面顶替了）。检查 /images/diary.json 是否已经发布。';
            }
            if (m === 'blob-version') {
                return '密文格式不对，可能是加密脚本版本不匹配。';
            }
            if (m === 'bad-payload') {
                return '解密成功但内容不是合法 JSON，文件可能损坏了。';
            }
            return '密码不对，或者文件已损坏。';
        }

        // ---------- 渲染 ----------
        function renderDiary(data) {
            var memos = (data && data.memos) ? data.memos.slice() : [];
            memos.sort(function (a, b) {
                return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
            });

            var html = '';
            memos.forEach(function (m, i) {
                var date = String(m.createdAt || '').slice(0, 10);
                html += '<div class="memo-item' + (i >= MEMO_PER_PAGE ? ' memo-hide' : '') +
                    '" data-created="' + esc(date) + '">' +
                    '<div class="memo-body"><div class="memo-content">' +
                    renderMarkdown(m.content || '') +
                    '</div></div>' +
                    '<div class="memo-meta"><time>' + esc(date) + '</time></div></div>';
            });

            var list = document.getElementById('memos-list');
            list.innerHTML = html || '<p class="memos-empty">还没有日记</p>';

            buildHeatmap();
            wireCollapse();
            wirePagination();
        }

        // ---------- GitHub 风格热力图 ----------
        function buildHeatmap() {
            var root = document.getElementById('heatmap-root');
            if (!root) return;

            var items = document.querySelectorAll('.memo-item');
            var heatmapData = {};
            items.forEach(function (item) {
                var d = item.getAttribute('data-created');
                if (d) {
                    var dateStr = d.substring(0, 10);
                    heatmapData[dateStr] = (heatmapData[dateStr] || 0) + 1;
                }
            });

            var today = new Date();
            today.setHours(0, 0, 0, 0);
            var endDay = today.getDay();
            var totalDays = 52 * 7 + endDay + 1;
            var startDate = new Date(today);
            startDate.setDate(startDate.getDate() - totalDays + 1);
            startDate.setDate(startDate.getDate() - startDate.getDay());

            var totalWeeks = Math.ceil(totalDays / 7);

            var weeks = [];
            for (var w = 0; w < totalWeeks; w++) {
                var week = [];
                for (var d = 0; d < 7; d++) {
                    var cellDate = new Date(startDate);
                    cellDate.setDate(cellDate.getDate() + w * 7 + d);
                    var key = cellDate.getFullYear() + '-' + String(cellDate.getMonth() + 1).padStart(2, '0') + '-' + String(cellDate.getDate()).padStart(2, '0');
                    var count = heatmapData[key] || 0;
                    var level = count === 0 ? 0 : count === 1 ? 1 : count <= 3 ? 2 : count <= 5 ? 3 : 4;
                    week.push({ date: cellDate, key: key, count: count, level: level, future: cellDate > today, month: cellDate.getMonth() });
                }
                weeks.push(week);
            }

            var monthLabels = [];
            var lastMonth = -1;
            for (var w2 = 0; w2 < weeks.length; w2++) {
                var firstDay = weeks[w2][0];
                if (!firstDay.future && firstDay.month !== lastMonth) {
                    monthLabels.push({ weekIndex: w2, label: MONTHS[firstDay.month] });
                    lastMonth = firstDay.month;
                }
            }

            var html = '<table style="min-width: 600px;">';

            html += '<tr><td class="heatmap-day-label"></td>';
            var monthColIdx = 0;
            for (var w3 = 0; w3 < totalWeeks; w3++) {
                if (monthColIdx < monthLabels.length && monthLabels[monthColIdx].weekIndex === w3) {
                    var nextIdx = monthColIdx + 1 < monthLabels.length ? monthLabels[monthColIdx + 1].weekIndex : totalWeeks;
                    var span = nextIdx - w3;
                    html += '<td colspan="' + span + '" class="heatmap-month-label">' + monthLabels[monthColIdx].label + '</td>';
                    w3 += span - 1;
                    monthColIdx++;
                } else {
                    html += '<td class="heatmap-month-label"></td>';
                }
            }
            html += '</tr>';

            for (var d2 = 0; d2 < 7; d2++) {
                html += '<tr>';
                html += '<td class="heatmap-day-label">' + DAYS[d2] + '</td>';
                for (var w4 = 0; w4 < weeks.length; w4++) {
                    var c = weeks[w4][d2];
                    if (c.future) {
                        html += '<td></td>';
                    } else {
                        html += '<td class="cell" data-level="' + c.level + '" style="background:' + COLORS[c.level] + ';" title="' + c.key + ': ' + c.count + ' 条日记"></td>';
                    }
                }
                html += '</tr>';
            }

            html += '</table>';
            root.innerHTML = html;

            var total = document.getElementById('heatmap-total');
            if (total) total.textContent = '过去一年共 ' + items.length + ' 条日记';

            setTimeout(function () {
                var wrap = document.querySelector('.heatmap-wrap');
                if (wrap) wrap.scrollLeft = wrap.scrollWidth;
            }, 100);
        }

        // ---------- 长内容折叠 ----------
        function wireCollapse() {
            document.querySelectorAll('.memo-item').forEach(function (item) {
                var body = item.querySelector('.memo-body');
                var bodyContent = item.querySelector('.memo-content');
                if (bodyContent && bodyContent.scrollHeight > COLLAPSE_HEIGHT) {
                    body.classList.add('collapsed');
                    var btn = document.createElement('button');
                    btn.className = 'memo-expand-btn';
                    btn.style.display = 'inline';
                    btn.textContent = '展开全文 ▼';
                    btn.onclick = function () {
                        if (body.classList.contains('collapsed')) {
                            body.style.maxHeight = bodyContent.scrollHeight + 'px';
                            body.classList.remove('collapsed');
                            btn.textContent = '收起 ▲';
                        } else {
                            body.style.maxHeight = COLLAPSE_HEIGHT + 'px';
                            body.classList.add('collapsed');
                            btn.textContent = '展开全文 ▼';
                        }
                    };
                    body.parentNode.insertBefore(btn, body.nextSibling);
                }
            });
        }

        // ---------- 分页 ----------
        function wirePagination() {
            var items = document.querySelectorAll('.memo-item');
            var totalPages = Math.ceil(items.length / MEMO_PER_PAGE) || 1;
            var currentPage = 1;
            var pag = document.getElementById('memo-pagination');
            if (!pag) return;

            function update() {
                var start = (currentPage - 1) * MEMO_PER_PAGE;
                var end = currentPage * MEMO_PER_PAGE;
                for (var i = 0; i < items.length; i++) {
                    if (i >= start && i < end) {
                        items[i].classList.remove('memo-hide');
                    } else {
                        items[i].classList.add('memo-hide');
                    }
                }
                var prevBtn = document.getElementById('memo-prev-btn');
                var nextBtn = document.getElementById('memo-next-btn');
                var pageInfo = document.getElementById('memo-page-info');
                if (prevBtn) prevBtn.className = currentPage <= 1 ? 'disabled' : '';
                if (nextBtn) nextBtn.className = currentPage >= totalPages ? 'disabled' : '';
                if (pageInfo) pageInfo.textContent = currentPage + ' / ' + totalPages;
                pag.style.display = totalPages <= 1 ? 'none' : '';
            }

            window.memoNextPage = function () {
                if (currentPage < totalPages) { currentPage++; update(); window.scrollTo(0, 0); }
            };
            window.memoPrevPage = function () {
                if (currentPage > 1) { currentPage--; update(); window.scrollTo(0, 0); }
            };

            update();
        }

        // ---------- 解锁 / 锁定 ----------
        function showDiary(data) {
            lockPanel.style.display = 'none';
            contentPanel.style.display = '';
            renderDiary(data);
        }

        function unlock() {
            var passphrase = input ? input.value : '';
            if (!passphrase) { say('请输入密码。'); return; }

            if (!window.crypto || !crypto.subtle) {
                say('当前环境不支持解密（页面需要 HTTPS 或 localhost）。');
                return;
            }

            setBusy(true);
            say('解密中…');

            var env;
            fetchEnvelope()
                .then(function (e) {
                    env = e;
                    return deriveKey(passphrase, env);
                })
                .then(function (key) {
                    return decryptWithKey(key, env).then(function (text) {
                        return rememberKey(key).then(function () { return text; });
                    });
                })
                .then(function (text) {
                    say('');
                    showDiary(parsePayload(text));
                    if (input) input.value = '';
                })
                .catch(function (err) {
                    say(describeFailure(err));
                    if (input) { input.focus(); input.select(); }
                })
                .then(function () {
                    setBusy(false);
                });
        }

        if (unlockBtn) unlockBtn.addEventListener('click', unlock);
        if (input) {
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') unlock();
            });
        }

        var lockBtn = document.getElementById('diary-lock-btn');
        if (lockBtn) {
            lockBtn.addEventListener('click', function () {
                try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* 忽略 */ }
                window.location.reload();
            });
        }

        // ---------- 本次会话解过就直接显示，不用再输一遍密码 ----------
        (function restore() {
            var cached = null;
            try { cached = sessionStorage.getItem(SESSION_KEY); } catch (e) { /* 忽略 */ }

            if (!cached) {
                if (input) input.focus();
                return;
            }

            if (!window.crypto || !crypto.subtle) {
                if (input) input.focus();
                return;
            }

            var key, env;
            crypto.subtle
                .importKey('raw', b64ToBytes(cached), { name: 'AES-GCM' }, false, ['decrypt'])
                .then(function (k) {
                    key = k;
                    return fetchEnvelope();
                })
                .then(function (e) {
                    env = e;
                    return decryptWithKey(key, env);
                })
                .then(function (text) {
                    showDiary(parsePayload(text));
                })
                .catch(function () {
                    // 重新加密过（换了密码或加了新日记）会让旧密钥失效，
                    // 这时不能说“密码错误”，否则用户会一头雾水。
                    try { sessionStorage.removeItem(SESSION_KEY); } catch (e2) { /* 忽略 */ }
                    say('登录状态已过期（日记更新过或密码改了），请重新输入密码。');
                    if (input) input.focus();
                });
        })();
    })();
</script>
